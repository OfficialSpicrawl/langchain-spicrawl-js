name: Publish

# Runs only when a version tag is pushed, e.g. v0.1.0.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Tag must match package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm run lint
      - run: npm publish --provenance --access public # prepublishOnly runs typecheck, test, build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
